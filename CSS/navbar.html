<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        nav {
            padding: 30px;
            background-color: rgb(12, 12, 31);
            color: white;
            margin: 20px;
            border-radius: 30px;
        }

        .logo {
            float: left;

        }

        ul {
            float: right;
        }

        li {
            float: left;
            margin-left: 20px;
            list-style: none;
        }

        a {
            text-decoration: none;
            color: white;
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">logo</div>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">Project</a></li>
        </ul>
    </nav>

</body>

</html>
