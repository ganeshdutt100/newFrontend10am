<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        nav {
            background-color: black;
            color: white;
            display: flex;
            justify-content: space-around;
            padding: 20px;
            border-radius: 30px;
            margin: 20px;
            align-items: center;
        }

        .logo {
            font-size: 20px;
        }

        .list {
            display: flex;
            gap: 20px;
            list-style-type: none;

        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">LOGO</div>
        <ul class="list">
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
            <li>Services</li>
            <li>Projects</li>
        </ul>
    </nav>
</body>

</html>
